
<style>
  .wrap { padding: 1.5rem 0; font-family: var(--font-sans); }
  .card { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  #error-box { display: none; background: var(--bg-danger); color: var(--text-danger); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-top: 8px; }
  #results { display: none; }
  .header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: var(--radius); background: var(--bg-success); color: var(--text-success); }
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .task-row:last-child { border-bottom: none; }
  .task-check { width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 50%; flex-shrink: 0; margin-top: 2px; }
  .task-name { font-size: 14px; color: var(--text-primary); line-height: 1.4; }
  .task-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .due-soon { color: var(--text-warning); }
  .due-late { color: var(--text-danger); }
  .empty { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 14px; }
  .count-chip { background: var(--bg-accent); color: var(--text-accent); font-size: 12px; padding: 3px 10px; border-radius: var(--radius); }
  #loading { display: none; color: var(--text-muted); font-size: 13px; padding: 1rem 0; }
</style>

<div class="wrap">
  <h2 class="sr-only">Georgia Grown — Ready column tasks</h2>

  <div class="card">
    <div class="label">Personal access token</div>
    <div class="row">
      <input type="password" id="pat" placeholder="1/xxxxxxxxxxxxxxxx..." style="flex:1;" />
      <button id="btn" onclick="loadTasks()">Load tasks ↗</button>
    </div>
    <div id="error-box"></div>
  </div>

  <div id="loading">Fetching tasks…</div>

  <div id="results">
    <div class="card">
      <div class="header-row">
        <span style="font-size:15px;font-weight:500;">Georgia Grown</span>
        <span class="badge">Ready</span>
        <span class="count-chip" id="task-count">0 tasks</span>
        <button onclick="loadTasks()" style="margin-left:auto;font-size:12px;">Refresh ↗</button>
      </div>
      <div id="task-list"></div>
    </div>
  </div>
</div>

<script>
const BASE = 'https://app.asana.com/api/1.0';
let storedPat = '';

function headers() {
  return { 'Authorization': 'Bearer ' + storedPat, 'Accept': 'application/json' };
}

async function get(path) {
  const res = await fetch(BASE + path, { headers: headers() });
  if (!res.ok) throw new Error('API error ' + res.status + ' on ' + path);
  return (await res.json()).data;
}

async function loadTasks() {
  const pat = document.getElementById('pat').value.trim();
  if (!pat) { showError('Paste your PAT first.'); return; }
  storedPat = pat;

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  try {
    const me = await get('/users/me?opt_fields=workspaces');
    const wsGid = me.workspaces?.[0]?.gid;
    if (!wsGid) throw new Error('No workspace found.');

    const projects = await get('/projects?workspace=' + wsGid + '&opt_fields=name&limit=100');
    const project = projects.find(p => p.name.toLowerCase().includes('georgia grown market msa'));
    if (!project) throw new Error('No project matching "Georgia Grown" found.');

    const sections = await get('/projects/' + project.gid + '/sections?opt_fields=name');
    const readySection = sections.find(s => s.name.toLowerCase().includes('ready'));
    if (!readySection) throw new Error('No "Ready" section found in Georgia Grown.');

    const tasks = await get('/sections/' + readySection.gid + '/tasks?opt_fields=name,due_on,assignee.name,completed&limit=100');
    const open = tasks.filter(t => !t.completed);

    renderTasks(open);
    document.getElementById('task-count').textContent = open.length + ' task' + (open.length !== 1 ? 's' : '');
    document.getElementById('results').style.display = 'block';

  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Load tasks ↗';
    document.getElementById('loading').style.display = 'none';
  }
}

function renderTasks(tasks) {
  const list = document.getElementById('task-list');
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty">No open tasks in Ready</div>';
    return;
  }

  const today = new Date();
  today.setHours(0,0,0,0);

  list.innerHTML = tasks.map(t => {
    let dueHtml = '';
    if (t.due_on) {
      const due = new Date(t.due_on + 'T00:00:00');
      const diff = Math.round((due - today) / 86400000);
      let cls = '';
      let label = 'Due ' + t.due_on;
      if (diff < 0) { cls = 'due-late'; label = 'Overdue by ' + Math.abs(diff) + 'd'; }
      else if (diff <= 3) { cls = 'due-soon'; label = diff === 0 ? 'Due today' : 'Due in ' + diff + 'd'; }
      dueHtml = ' · <span class="' + cls + '">' + label + '</span>';
    }
    const assignee = t.assignee?.name ? t.assignee.name : 'Unassigned';
    return '<div class="task-row"><div class="task-check"></div><div><div class="task-name">' + t.name + '</div><div class="task-meta">' + assignee + dueHtml + '</div></div></div>';
  }).join('');
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}
</script>
