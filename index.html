<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Asana Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --blue:#6aa9e0; --blue-d:#9cc7f0; --green:#4cc085; --green-d:#6cd49d; --red:#e26b66;
          --bg:#12151a; --panel:#2a2f38; --panel2:#353b45; --border:#3c4350;
          --text:#edeff2; --muted:#a3aab4; --faint:#737b86; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin:0; background:var(--bg); color:var(--text); }
  .wrap { max-width:1040px; margin:32px auto; padding:0 20px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .card { background:var(--panel); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.4);
          cursor:pointer; transition:transform .08s, box-shadow .08s; border:1px solid var(--border); }
  .card:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.55); border-color:var(--blue); }
  .card h3 { margin:0 0 14px; font-size:16px; }
  .stats { display:flex; gap:24px; }
  .stat .n { font-size:24px; font-weight:600; color:var(--blue-d); }
  .stat .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card .go { margin-top:14px; font-size:12px; color:var(--blue-d); }
  .head-right { display:flex; align-items:center; gap:12px; }
  .dash-updated { font-size:11px; color:var(--faint); white-space:nowrap; }
  .cap-bar { margin-top:14px; }
  .cap-bar .track { height:8px; background:var(--panel2); border-radius:5px; overflow:hidden; }
  .cap-bar .fill { height:100%; background:var(--green); border-radius:5px; }
  .cap-bar.over .fill { background:var(--red); }
  .cap-bar .lab { font-size:11px; color:var(--muted); margin-top:5px; }
  /* month filter toolbar */
  .toolbar { display:flex; align-items:center; gap:8px; margin:0 0 18px; font-size:13px; color:var(--muted); }
  .toolbar label { margin-left:6px; }
  .toolbar label:first-child { margin-left:0; }
  .toolbar select, .toolbar input[type=date] { background:var(--panel2); color:var(--text);
                    border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer; }
  .toolbar input[type=date]::-webkit-calendar-picker-indicator { filter:invert(.8); cursor:pointer; }
  .toolbar.est-toolbar, .toolbar.team-toolbar { flex-wrap:wrap; }
  .toolbar .tb-label { font-weight:600; color:var(--text); margin-left:0; }
  .toolbar .chk { display:inline-flex; align-items:center; gap:5px; margin-left:0; cursor:pointer; }
  .toolbar .chk input { cursor:pointer; margin:0; }
  .toolbar .tb-sep { width:1px; align-self:stretch; background:var(--border); margin:2px 4px; }
  /* dashboard layout: left nav + content */
  .layout { display:flex; gap:24px; align-items:flex-start; }
  .sidebar { flex:0 0 210px; position:sticky; top:32px; background:var(--panel); border-radius:12px;
             padding:14px 12px; box-shadow:0 1px 3px rgba(0,0,0,.4); border:1px solid var(--border); }
  .sidebar .brand { font-size:15px; font-weight:600; padding:6px 12px 14px; color:var(--text); }
  .nav-section { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
                 color:var(--faint); padding:14px 12px 6px; }
  .nav-section:first-of-type { padding-top:4px; }
  .nav-item { display:block; padding:10px 12px; margin-bottom:4px; border-radius:8px;
              font-size:14px; color:var(--muted); text-decoration:none; cursor:pointer; }
  .nav-item:hover { background:var(--panel2); color:var(--text); }
  .nav-item.active { background:var(--blue); color:#10141a; font-weight:600; }
  .content { flex:1; min-width:0; }
  .content .head { margin-bottom:4px; }
  .content h1 { font-size:20px; margin:0; }
  .section-h { font-size:16px; margin:30px 0 12px; padding-top:6px; border-top:1px solid var(--border); }
  .section-h.flush { margin-top:8px; padding-top:0; border-top:0; }   /* first heading under the filter */
  /* Tasks tab: total-hours summary banner */
  .summary-bar { display:flex; gap:24px; background:var(--panel2); border:1px solid var(--border);
                 border-radius:12px; padding:18px 24px; margin:6px 0 4px; }
  .summary-stat { display:flex; flex-direction:column; gap:4px; }
  .summary-stat .n { font-size:28px; font-weight:700; color:var(--green-d); font-variant-numeric:tabular-nums; }
  .summary-stat .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card.june:hover { border-color:var(--green); }
  .card.june .stat .n, .card.june .go { color:var(--green-d); }
  .card.june .cap-bar { margin-top:22px; }   /* extra space between the big numbers and the bar */
  /* MSA/capacity cards: lighter panel + brighter border so they stand out at the top of the list */
  .card.cap { background:var(--panel2); border-color:#5c6b86; }
  .grp-card { grid-column: 1 / -1; }   /* combined buckets (e.g. CMD) span the whole row */
  /* combined budget-group card: per-project breakdown rows */
  .grp-tag { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
             color:var(--muted); background:var(--panel2); border-radius:8px; padding:2px 7px; vertical-align:middle; }
  .grp-members { margin-top:16px; border-top:1px solid var(--border); padding-top:6px; }
  .grp-row { display:flex; justify-content:space-between; align-items:center; gap:10px;
             padding:7px 6px; border-radius:7px; font-size:13px; cursor:pointer; }
  .grp-row:hover { background:var(--panel2); }
  /* On highlighted (.cap) bucket cards the card bg is already --panel2, so member rows need a
     lighter hover to stay visible. */
  .card.cap .grp-row:hover { background:#414854; }
  .grp-row .grp-name { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grp-row .grp-h { color:var(--green-d); font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* detail */
  .head { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .left { display:flex; align-items:center; gap:14px; }
  .crumbs { font-size:15px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .crumb { color:var(--blue-d); text-decoration:none; cursor:pointer; }
  .crumb:hover { text-decoration:underline; }
  .crumb-sep { color:#5a616b; }
  .crumb-cur { font-weight:600; }
  button.btn { background:var(--blue); color:#10141a; border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button.btn:hover { background:var(--blue-d); }
  button.btn:disabled { background:#434a56; color:#8a929c; cursor:default; }
  .back { background:var(--panel2); color:var(--text); }
  .back:hover { background:#414854; }
  .panel { background:var(--panel); border-radius:12px; padding:26px 30px 36px; box-shadow:0 1px 3px rgba(0,0,0,.4); border:1px solid var(--border); }
  #updated { font-size:12px; color:var(--muted); }
  .chart-box { position:relative; height:480px; margin-top:10px; }
  .muted { color:var(--muted); }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  /* drill-down task list */
  .drill-head { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .drill-head h2 { font-size:17px; margin:0; }
  .drill-total { font-size:13px; color:var(--muted); }
  table.tasks { width:100%; border-collapse:collapse; font-size:14px; }
  table.tasks th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
                   color:var(--muted); border-bottom:2px solid var(--border); padding:8px 10px; }
  table.tasks th.hours { text-align:right; }
  table.tasks td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.tasks tr.parent td { font-weight:600; }
  table.tasks tr.sub td { font-weight:400; color:var(--muted); }
  .proj-toggle { display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  .proj-toggle input { cursor:pointer; margin:0; flex:0 0 auto; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--panel2); color:var(--text); }
  .sub-name { padding-left:22px; position:relative; }
  .sub-name::before { content:'↳'; position:absolute; left:6px; color:#5a616b; }
  .done { text-decoration:line-through; color:var(--faint); }
  .hours { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  /* settings: per-person graph colors */
  .color-list { display:flex; flex-direction:column; gap:2px; }
  .color-row { display:flex; align-items:center; gap:12px; padding:9px 6px; border-bottom:1px solid var(--border); }
  .color-row:last-child { border-bottom:0; }
  .color-row .color-name { flex:1; font-size:14px; }
  .color-pick { width:40px; height:28px; padding:0; border:1px solid var(--border); border-radius:6px;
                background:var(--panel2); cursor:pointer; }
  .reset-one { background:none; border:0; color:var(--blue-d); font-size:12px; cursor:pointer; padding:4px 6px; }
  .reset-one:hover:not(:disabled) { text-decoration:underline; }
  .reset-one:disabled { color:var(--faint); cursor:default; }
  .color-actions { margin-top:18px; }

  /* login + sign-out (static build) */
  .login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:34px 32px;
                max-width:430px; width:100%; box-shadow:0 10px 34px rgba(0,0,0,.5); }
  .login-card h1 { font-size:22px; margin:0 0 6px; }
  .login-card .sub { margin:0 0 18px; }
  .login-card input[type=password] { width:100%; box-sizing:border-box; background:var(--panel2); color:var(--text);
                border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:14px; }
  .login-card .remember { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:12px 0 16px; }
  .login-card .btn { width:100%; padding:11px; }
  .login-err { color:var(--red); font-size:13px; margin:0 0 12px; }
  .login-note { font-size:11px; color:var(--faint); margin-top:16px; line-height:1.55; }
  .signout { position:fixed; top:16px; right:18px; z-index:50; background:var(--panel2); color:var(--text);
             border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; }
  .signout:hover { background:#414854; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

// ===== Static build: Asana data layer (runs entirely in the browser) =====
const ASANA_API = 'https://app.asana.com/api/1.0';
const EST_FIELD = "Estimated time";
const EXCLUDE_SECTIONS = new Set(["completed"]);
const ASSIGNEE_HOURS_CAP = 128;
const TEAM_MEMBERS = ["Miranda Osborn", "Linh Trinh", "Julia Reeves", "Grant Roach", "Alice Chao"];
const PROJECTS = [{"gid": "1214228966572515", "name": "Georgia Grown Market MSA", "cap": 70}, {"gid": "1214228966572497", "name": "Mid Eastern MSA", "cap": 38}, {"gid": "1214228966572546", "name": "Cohen's Retreat MSA", "cap": 40}, {"gid": "1216989200658405", "name": "My Pest Solutions SEO", "cap": 4}, {"gid": "1214228966572508", "name": "Firebird MSA"}, {"gid": "1214228966572503", "name": "Myrick Marine"}, {"gid": "1214229029715234", "name": "Savannah Bee: Zendesk"}, {"gid": "1214228966572536", "name": "CMD: Concierge Clinics"}, {"gid": "1214228966572531", "name": "CMD: Pathologic"}, {"gid": "1214228966572526", "name": "CMD: Products"}, {"gid": "1214228966572521", "name": "Georgia Skin & Cancer Clinic"}, {"gid": "1214228966572541", "name": "DocSmith.md MSA", "cap": 24}, {"gid": "1214228966572551", "name": "Savannah Camellia Fest 2026"}, {"gid": "1214755322546416", "name": "Project Twilight"}, {"gid": "1214228966572578", "name": "Claude: Discovery and Engineering"}, {"gid": "1214228966572573", "name": "Autotask Reporting"}, {"gid": "1214228966572568", "name": "Brain Dump"}, {"gid": "1214228966572563", "name": "Internal IIT Backlog"}, {"gid": "1216154609521581", "name": "NuNu"}, {"gid": "1216640931651593", "name": "Ross Wood Website Redesign", "cap": 30}, {"gid": "1216208009045309", "name": "Marsh and Main"}];
const GROUPS = [{"name": "CMD", "cap": 244, "gids": ["1214228966572536", "1214228966572531", "1214228966572526", "1216154609521581"]}];
const DEF_START = "2026-06-01", DEF_END = "2026-06-30";
const PROJECT_NAMES = Object.fromEntries(PROJECTS.map(p => [p.gid, p.name]));
const PROJECT_CAPS  = Object.fromEntries(PROJECTS.map(p => [p.gid, p.cap == null ? null : p.cap]));

let TOKEN = null;
const _realFetch = window.fetch.bind(window);

function round2(x){ return Math.round((x + Number.EPSILON) * 100) / 100; }
function sum(arr){ return arr.reduce((a, b) => a + b, 0); }
function nowStr(){ const d = new Date(), p = n => String(n).padStart(2, '0');
  const h24 = d.getHours(), ap = h24 < 12 ? 'AM' : 'PM', h12 = h24 % 12 || 12;
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(h12)}:${p(d.getMinutes())}:${p(d.getSeconds())} ${ap}`; }

// Bound real network concurrency (Asana rate limits + browser per-host caps).
let _active = 0; const _waiters = [];
function _gate(fn){
  return new Promise((resolve, reject) => {
    const run = () => { _active++; fn().then(resolve, reject).finally(() => { _active--; const n = _waiters.shift(); if (n) n(); }); };
    if (_active < 8) run(); else _waiters.push(run);
  });
}

// GET an Asana collection (follows pagination, retries on 429). Returns the concatenated data array.
async function asanaGet(pathOrUrl){
  let out = [], next = pathOrUrl;
  while (next){
    const full = next.startsWith('http') ? next : ASANA_API + next;
    const page = await _gate(async () => {
      for (;;){
        const r = await _realFetch(full, { headers: { Authorization: 'Bearer ' + TOKEN } });
        if (r.status === 429){ const ra = Number(r.headers.get('Retry-After') || 1); await new Promise(s => setTimeout(s, ra * 1000)); continue; }
        if (!r.ok) throw new Error('Asana ' + r.status);
        return r.json();
      }
    });
    out = out.concat(page.data || []);
    next = page.next_page && page.next_page.uri ? page.next_page.uri : null;
  }
  return out;
}
const mapAll = (arr, fn) => Promise.all(arr.map(fn));

// ---- Estimated-hours layer (mirrors project_detail / get_summaries / get_assignee_load) ----
function taskMinutes(t){ for (const cf of (t.custom_fields || [])){ if (cf.name === EST_FIELD && cf.number_value != null) return cf.number_value; } return 0; }
function actualMinutes(t){ return t.actual_time_minutes || 0; }
function sectionName(t, gid){ let fb = ''; for (const m of (t.memberships || [])){ const sec = (m.section || {}).name; if (!sec) continue; if ((m.project || {}).gid === gid) return sec; fb = fb || sec; } return fb; }
function isExcluded(t, gid){ return EXCLUDE_SECTIONS.has(sectionName(t, gid).trim().toLowerCase()); }

function fetchTasks(gid){
  const f = 'name,assignee.name,completed,actual_time_minutes,custom_fields.name,custom_fields.number_value,memberships.section.name,memberships.project.gid';
  return asanaGet(`/projects/${gid}/tasks?opt_fields=${f}&limit=100`);
}
function fetchSubtasks(g){
  const f = 'name,assignee.name,completed,actual_time_minutes,custom_fields.name,custom_fields.number_value';
  return asanaGet(`/tasks/${g}/subtasks?opt_fields=${f}&limit=100`);
}

async function buildTask(t, gid){
  const subs = [];
  for (const s of await fetchSubtasks(t.gid)){
    if (s.completed) continue;
    subs.push({ name: s.name || '(untitled)', assignee: (s.assignee || {}).name || 'Unassigned',
      hours: round2(taskMinutes(s) / 60), actual: round2(actualMinutes(s) / 60) });
  }
  return { gid: t.gid, name: t.name || '(untitled)', assignee: (t.assignee || {}).name || 'Unassigned',
    hours: round2(taskMinutes(t) / 60), actual: round2(actualMinutes(t) / 60), section: sectionName(t, gid), subtasks: subs };
}

async function projectDetail(gid){
  const tasks = (await fetchTasks(gid)).filter(t => !t.completed && !isExcluded(t, gid));
  const detailed = await mapAll(tasks, t => buildTask(t, gid));
  const totals = {}, actuals = {}, counts = {};
  for (const d of detailed){
    totals[d.assignee] = (totals[d.assignee] || 0) + d.hours;
    actuals[d.assignee] = (actuals[d.assignee] || 0) + d.actual;
    counts[d.assignee] = (counts[d.assignee] || 0) + 1;
    for (const s of d.subtasks){
      totals[s.assignee] = (totals[s.assignee] || 0) + s.hours;
      actuals[s.assignee] = (actuals[s.assignee] || 0) + s.actual;
      counts[s.assignee] = (counts[s.assignee] || 0) + 1;
    }
  }
  const ordered = Object.keys(totals).sort((x, y) => totals[y] - totals[x]);
  return { gid, name: PROJECT_NAMES[gid] || gid, labels: ordered,
    hours: ordered.map(n => round2(totals[n])), actual_hours: ordered.map(n => round2(actuals[n])),
    counts: ordered.map(n => counts[n]), ntasks: detailed.length, tasks: detailed, updated: nowStr() };
}

const CACHE = { summaries: null, detail: {}, june_summaries: {}, june_detail: {} };
function summaryFromDetail(d){ return { gid: d.gid, name: d.name, ntasks: d.ntasks, hours: round2(sum(d.hours)), cap: PROJECT_CAPS[d.gid], updated: d.updated }; }

async function getDetail(gid, refresh){
  if (!refresh && CACHE.detail[gid]) return CACHE.detail[gid];
  const data = await projectDetail(gid);
  CACHE.detail[gid] = data;
  if (CACHE.summaries) CACHE.summaries = CACHE.summaries.map(s => s.gid === gid ? summaryFromDetail(data) : s);
  return data;
}
async function getSummaries(refresh){
  if (!refresh && CACHE.summaries) return CACHE.summaries;
  const details = await mapAll(PROJECTS, p => getDetail(p.gid, refresh));
  return (CACHE.summaries = details.map(summaryFromDetail));
}
// Task/subtask rows assigned to `name` within one project detail (est/actual/remaining + status).
function assigneeProjectTasks(d, name){
  const rows = [];
  for (const t of d.tasks){
    if (t.assignee === name)
      rows.push({ name: t.name, type: 'task', status: t.section, estimated: t.hours, actual: t.actual, remaining: round2(t.hours - t.actual), context: '' });
    for (const s of t.subtasks){
      if (s.assignee === name)
        rows.push({ name: s.name, type: 'subtask', status: t.section, estimated: s.hours, actual: s.actual, remaining: round2(s.hours - s.actual),
          context: t.assignee === name ? '' : `under "${t.name}" · ${t.assignee}` });
    }
  }
  return rows;
}
async function getAssigneeLoad(refresh){
  const details = await mapAll(PROJECTS, p => getDetail(p.gid, refresh));
  const est = {}, act = {}, counts = {}, breakdown = {};
  for (const d of details){
    d.labels.forEach((name, i) => {
      const e = d.hours[i], aa = d.actual_hours[i], cnt = d.counts[i];
      est[name] = (est[name] || 0) + e; act[name] = (act[name] || 0) + aa; counts[name] = (counts[name] || 0) + cnt;
      if (e || aa) (breakdown[name] = breakdown[name] || []).push({ project: d.name, estimated: round2(e), actual: round2(aa), remaining: round2(e - aa), tasks: assigneeProjectTasks(d, name) });
    });
  }
  const ordered = TEAM_MEMBERS.filter(n => n in est).sort((x, y) => (est[y] - act[y]) - (est[x] - act[x]));
  if ('Unassigned' in est) ordered.push('Unassigned');
  return { cap: ASSIGNEE_HOURS_CAP, labels: ordered,
    hours: ordered.map(n => round2(est[n] - act[n])), estimated: ordered.map(n => round2(est[n])),
    actual: ordered.map(n => round2(act[n])), counts: ordered.map(n => counts[n]),
    breakdown: Object.fromEntries(ordered.map(n => [n, breakdown[n] || []])), updated: nowStr() };
}

// ---- Logged-hours layer for a date range (mirrors june_detail / get_june_summaries) ----
function fetchTimeEntries(g){ return asanaGet(`/tasks/${g}/time_tracking_entries?opt_fields=duration_minutes,entered_on,created_by.name,billable_status&limit=100`); }
function fetchSubtasksTime(g){ return asanaGet(`/tasks/${g}/subtasks?opt_fields=name,actual_time_minutes,completed,completed_at&limit=100`); }

async function entriesForItem(name, gid, start, end){
  const res = [];
  for (const e of await fetchTimeEntries(gid)){
    const entered = e.entered_on || '';
    if (entered && start <= entered && entered <= end)
      res.push({ entry_gid: e.gid, task: name, by: (e.created_by || {}).name || 'Unknown', date: entered,
        minutes: e.duration_minutes || 0, billable: e.billable_status === 'billable' });
  }
  return res;
}
async function juneDetail(gid, start, end){
  const tasks = await asanaGet(`/projects/${gid}/tasks?opt_fields=name,actual_time_minutes,num_subtasks,completed,completed_at&limit=100`);
  // Tasks/subtasks completed within the date range (by completed_at), deduped by gid.
  const completedDates = {};
  const noteCompleted = it => {
    if (it.completed && it.completed_at){ const day = it.completed_at.slice(0, 10);
      if (start <= day && day <= end) completedDates[it.gid] = day; }
  };
  const cand = {};
  for (const t of tasks){ noteCompleted(t); if ((t.actual_time_minutes || 0) > 0) cand[t.gid] = t.name || '(untitled)'; }
  const parents = tasks.filter(t => (t.num_subtasks || 0) > 0).map(t => t.gid);
  for (const subs of await mapAll(parents, fetchSubtasksTime))
    for (const s of subs){ noteCompleted(s); if ((s.actual_time_minutes || 0) > 0) cand[s.gid] = s.name || '(untitled)'; }
  const candidates = Object.entries(cand);   // [gid, name]
  const seen = new Set(), entries = [];
  for (const lst of await mapAll(candidates, ([g, name]) => entriesForItem(name, g, start, end)))
    for (const e of lst){ if (e.entry_gid && seen.has(e.entry_gid)) continue; if (e.entry_gid) seen.add(e.entry_gid); entries.push(e); }
  const totals = {}, counts = {}, bill = {}, unbill = {};
  for (const e of entries){
    totals[e.by] = (totals[e.by] || 0) + e.minutes; counts[e.by] = (counts[e.by] || 0) + 1;
    const b = e.billable ? bill : unbill; b[e.by] = (b[e.by] || 0) + e.minutes;
  }
  const ordered = Object.keys(totals).sort((x, y) => totals[y] - totals[x]);
  entries.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  return { gid, name: PROJECT_NAMES[gid] || gid, start, end, labels: ordered,
    hours: ordered.map(n => round2(totals[n] / 60)),
    billable: ordered.map(n => round2((bill[n] || 0) / 60)),
    unbillable: ordered.map(n => round2((unbill[n] || 0) / 60)),
    counts: ordered.map(n => counts[n]),
    total_hours: round2(sum(Object.values(totals)) / 60),
    billable_hours: round2(sum(Object.values(bill)) / 60),
    unbillable_hours: round2(sum(Object.values(unbill)) / 60),
    completed: Object.keys(completedDates).length,
    nentries: entries.length,
    entries: entries.map(e => ({ task: e.task, by: e.by, date: e.date, hours: round2(e.minutes / 60), billable: e.billable })), updated: nowStr() };
}
function juneSummaryFromDetail(d){ return { gid: d.gid, name: d.name, start: d.start, end: d.end, hours: d.total_hours, billable_hours: d.billable_hours, unbillable_hours: d.unbillable_hours, completed: d.completed, nentries: d.nentries, cap: PROJECT_CAPS[d.gid], updated: d.updated }; }

async function getJuneDetail(gid, refresh, start, end){
  const key = start + ':' + end;
  if (!refresh && CACHE.june_detail[key] && CACHE.june_detail[key][gid]) return CACHE.june_detail[key][gid];
  const data = await juneDetail(gid, start, end);
  (CACHE.june_detail[key] = CACHE.june_detail[key] || {})[gid] = data;
  if (CACHE.june_summaries[key]) CACHE.june_summaries[key] = CACHE.june_summaries[key].map(s => s.gid === gid ? juneSummaryFromDetail(data) : s);
  return data;
}
async function getJuneSummaries(refresh, start, end){
  const key = start + ':' + end;
  if (!refresh && CACHE.june_summaries[key]) return CACHE.june_summaries[key];
  const details = await mapAll(PROJECTS, p => getJuneDetail(p.gid, refresh, start, end));
  return (CACHE.june_summaries[key] = details.map(juneSummaryFromDetail));
}

// ---- Route /api/* (same shapes the existing UI expects) ----
async function handleApi(p){
  const u = new URL(p, location.origin), path = u.pathname, q = u.searchParams;
  const refresh = q.get('refresh') === '1';
  let start = q.get('start') || DEF_START, end = q.get('end') || DEF_END;
  if (start > end){ const t = start; start = end; end = t; }
  if (path === '/api/projects') return getSummaries(refresh);
  if (path === '/api/june') return getJuneSummaries(refresh, start, end);
  if (path === '/api/assignees') return getAssigneeLoad(refresh);
  if (path === '/api/groups') return GROUPS;
  if (path.startsWith('/api/june/')) return getJuneDetail(path.split('/').pop(), refresh, start, end);
  if (path.startsWith('/api/project/')) return getDetail(path.split('/').pop(), refresh);
  throw new Error('Unknown API ' + path);
}
// Intercept the page's own /api/* calls; everything else (Asana, CDN) passes through.
window.fetch = async (input, init) => {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  const p = url.replace(location.origin, '');
  if (p.startsWith('/api/')){
    try { return new Response(JSON.stringify(await handleApi(p)), { status: 200, headers: { 'Content-Type': 'application/json' } }); }
    catch (err) { return new Response(JSON.stringify({ error: String(err && err.message || err) }), { status: 502, headers: { 'Content-Type': 'application/json' } }); }
  }
  return _realFetch(input, init);
};

const STORE_KEY = 'asana_pat';
function loadToken(){ return sessionStorage.getItem(STORE_KEY) || localStorage.getItem(STORE_KEY) || null; }
function clearToken(){ sessionStorage.removeItem(STORE_KEY); localStorage.removeItem(STORE_KEY); }
async function validateToken(tok){
  const r = await _realFetch(ASANA_API + '/users/me?opt_fields=name,email', { headers: { Authorization: 'Bearer ' + tok } });
  if (!r.ok) throw new Error(r.status === 401 ? 'Invalid token' : 'Asana ' + r.status);
  return (await r.json()).data;
}
function showSignout(who){
  let b = document.getElementById('signout-fab');
  if (!b){ b = document.createElement('button'); b.id = 'signout-fab'; b.className = 'signout'; document.body.appendChild(b); }
  b.textContent = 'Sign out'; b.title = who ? ('Signed in as ' + who) : ''; b.onclick = doLogout; b.style.display = 'block';
}
function hideSignout(){ const b = document.getElementById('signout-fab'); if (b) b.style.display = 'none'; }
function doLogout(){ clearToken(); TOKEN = null; window.__authed = false; hideSignout();
  if (typeof chart !== 'undefined' && chart){ try { chart.destroy(); } catch (e) {} chart = null; } location.hash = ''; renderLogin(); }

function renderLogin(err){
  window.__authed = false; hideSignout();
  document.getElementById('app').innerHTML = `
    <div class="login"><div class="login-card">
      <h1>Asana Dashboard</h1>
      <p class="sub">Connect with a Personal Access Token. Create one in Asana → My Settings → Apps → Manage developer apps → Personal access tokens.</p>
      <input type="password" id="pat" placeholder="Paste your Asana PAT" autocomplete="off" spellcheck="false">
      <label class="remember"><input type="checkbox" id="remember"> Remember on this device</label>
      ${err ? `<p class="login-err">${esc(err)}</p>` : ''}
      <button class="btn" id="connect">Connect</button>
      <p class="login-note">Your token is stored only in this browser — sessionStorage, or localStorage if you check “remember” — and sent directly to Asana over HTTPS. Don’t use this on a shared computer, and never commit a token to the repo.</p>
    </div></div>`;
  const inp = document.getElementById('pat'), go = document.getElementById('connect');
  const submit = async () => {
    const tok = inp.value.trim(); if (!tok) return;
    go.disabled = true; go.textContent = 'Connecting…'; TOKEN = tok;
    try {
      const me = await validateToken(tok);
      (document.getElementById('remember').checked ? localStorage : sessionStorage).setItem(STORE_KEY, tok);
      window.__authed = true; showSignout(me.name || me.email || 'Signed in'); location.hash = ''; window.__startApp();
    } catch (e){ TOKEN = null; renderLogin(e && e.message || String(e)); }
  };
  go.onclick = submit;
  inp.onkeydown = ev => { if (ev.key === 'Enter') submit(); };
  inp.focus();
}

async function bootAuth(){
  const tok = loadToken();
  if (!tok){ renderLogin(); return; }
  TOKEN = tok;
  try { const me = await validateToken(tok); window.__authed = true; showSignout(me.name || me.email || 'Signed in'); window.__startApp(); }
  catch (e){ clearToken(); TOKEN = null; renderLogin('Saved token is no longer valid — please reconnect.'); }
}

// Draws a dashed horizontal target line (e.g. the 128 h per-assignee cap) on a bar chart.
// Enable per-chart via options.plugins.capLine = { value: <hours> }.
const capLinePlugin = {
  id: 'capLine',
  afterDatasetsDraw(c) {
    const cfg = c.options.plugins.capLine;
    if (!cfg || cfg.value == null) return;
    const y = c.scales.y.getPixelForValue(cfg.value);
    const { left, right } = c.chartArea, ctx = c.ctx;
    ctx.save();
    ctx.beginPath(); ctx.setLineDash([6, 4]); ctx.lineWidth = 2; ctx.strokeStyle = '#8fc0ee';
    ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = '#8fc0ee'; ctx.font = '600 12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(h2(cfg.value) + ' h target', right - 6, y - 6);
    ctx.restore();
  }
};
Chart.register(capLinePlugin);

// Team Capacity bar color: green when a person lands within CAP_TOLERANCE hours of the
// target (i.e. appropriately loaded), red when they are under- or over-booked past it.
const CAP_TOLERANCE = 15;
const capColor = (h, cap) => Math.abs(h - cap) <= CAP_TOLERANCE ? '#4cc085' : '#e26b66';

// Label for task rows that sit in no status column; used by the status filters.

const r2 = v => Math.round(v * 100) / 100;

// Draws a per-bar monthly-budget marker: a short amber line across each billable bar that
// has a cap. Enable via options.plugins.capMarks = { caps: [<cap or null per bar>] }.
const capMarksPlugin = {
  id: 'capMarks',
  afterDatasetsDraw(c) {
    const cfg = c.options.plugins.capMarks;
    if (!cfg || !cfg.caps) return;
    const meta = c.getDatasetMeta(0), y = c.scales.y, ctx = c.ctx;
    ctx.save();
    cfg.caps.forEach((cap, i) => {
      const bar = meta.data[i];
      if (cap == null || !bar) return;
      const half = (bar.width || 18) / 2 + 2, py = y.getPixelForValue(cap);
      ctx.beginPath(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#f0c674';
      ctx.moveTo(bar.x - half, py); ctx.lineTo(bar.x + half, py); ctx.stroke();
    });
    ctx.restore();
  }
};

function fmtErr(e){ return '<p class="muted">Error: '+e+'</p>'; }
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function h2(x){ return Number(x || 0).toFixed(2); }   // always two decimals: 40.00, 40.50, 40.75

// Well-separated categorical hues, one per color family, so stacked segments never blend.
// Deliberately NO orange/amber/gold — those get lost against the amber capacity marker (#f0c674).
const PERSON_PALETTE = [
  '#1f77b4', // blue
  '#d62728', // red
  '#2ca02c', // green
  '#9467bd', // purple
  '#17becf', // cyan
  '#e377c2', // pink
  '#8c564b', // brown
  '#7f7f7f', // gray
  '#393b79', // deep indigo
  '#a55194', // plum
];
// Fixed colors for specific people; everyone else auto-assigns a still-unused palette hue.
// Seeded into _personColors so an override is reserved up front and never clashes with an
// auto-assigned person, even if that person is colored first.
const PERSON_COLOR_OVERRIDES = { 'Miranda Osborn': '#9467bd', 'Unassigned': '#7f7f7f' };   // Miranda purple (was orange); Unassigned always grey
const _personColors = Object.assign({}, PERSON_COLOR_OVERRIDES);
let _personColorN = 0;
// User-picked colors (Settings tab), persisted per-browser. These win over the built-in
// defaults/auto-assignment so a chosen color applies everywhere the same person is drawn.
const PERSON_COLOR_STORE = 'personColors.v1';
function loadPersonColorConfig(){
  try { return JSON.parse(localStorage.getItem(PERSON_COLOR_STORE)) || {}; } catch (e) { return {}; }
}
function savePersonColorConfig(){
  try { localStorage.setItem(PERSON_COLOR_STORE, JSON.stringify(personColorConfig)); } catch (e) {}
}
let personColorConfig = loadPersonColorConfig();
// Every name we've been asked to color this session, so the Settings tab can list everyone
// (seeded with the known team + Unassigned so they always show even before any chart loads).
const _seenPeople = new Set([...TEAM_MEMBERS, 'Unassigned']);
function personColor(name){
  _seenPeople.add(name);
  if (name in personColorConfig) return personColorConfig[name];   // user choice wins
  if (name in _personColors) return _personColors[name];
  // Skip palette entries already taken (by an override, a user color, or an earlier person).
  const used = new Set([...Object.values(_personColors), ...Object.values(personColorConfig)]);
  while (used.size < PERSON_PALETTE.length && used.has(PERSON_PALETTE[_personColorN % PERSON_PALETTE.length])) _personColorN++;
  return (_personColors[name] = PERSON_PALETTE[_personColorN++ % PERSON_PALETTE.length]);
}
// Default color for a person, ignoring any user override (used by the Settings "Reset" action
// to show what they'd revert to).
function personDefaultColor(name){
  if (name in _personColors) return _personColors[name];
  const used = new Set([...Object.values(_personColors), ...Object.values(personColorConfig)]);
  while (used.size < PERSON_PALETTE.length && used.has(PERSON_PALETTE[_personColorN % PERSON_PALETTE.length])) _personColorN++;
  return (_personColors[name] = PERSON_PALETTE[_personColorN++ % PERSON_PALETTE.length]);
}
// Build stacked Chart.js datasets (one per person) from project rows. hoursOf(row) returns
// { person: hours } for that project; persons are ordered by grand total (biggest at the bottom).
function personStacks(rows, hoursOf){
  const maps = rows.map(hoursOf), totals = {};
  maps.forEach(m => Object.entries(m).forEach(([p, h]) => { totals[p] = (totals[p] || 0) + h; }));
  const persons = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
  return persons.map(p => ({ label: p, data: maps.map(m => Math.round((m[p] || 0) * 100) / 100),
    backgroundColor: personColor(p), borderColor: personColor(p), borderWidth: 0 }));
}

          <h1 id="tab-title"></h1>
