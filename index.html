<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Asana Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --blue:#6aa9e0; --blue-d:#9cc7f0; --green:#4cc085; --green-d:#6cd49d; --red:#e26b66;
          --bg:#12151a; --panel:#2a2f38; --panel2:#353b45; --border:#3c4350;
          --text:#edeff2; --muted:#a3aab4; --faint:#737b86; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; margin:0; background:var(--bg); color:var(--text); }
  .wrap { max-width:1040px; margin:32px auto; padding:0 20px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .card { background:var(--panel); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.4);
          cursor:pointer; transition:transform .08s, box-shadow .08s; border:1px solid var(--border); }
  .card:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.55); border-color:var(--blue); }
  .card h3 { margin:0 0 14px; font-size:16px; }
  .stats { display:flex; gap:24px; }
  .stat .n { font-size:24px; font-weight:600; color:var(--blue-d); }
  .stat .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card .go { margin-top:14px; font-size:12px; color:var(--blue-d); }
  .card-updated { margin-top:8px; font-size:11px; color:var(--faint); }
  .cap-bar { margin-top:14px; }
  .cap-bar .track { height:8px; background:var(--panel2); border-radius:5px; overflow:hidden; }
  .cap-bar .fill { height:100%; background:var(--green); border-radius:5px; }
  .cap-bar.over .fill { background:var(--red); }
  .cap-bar .lab { font-size:11px; color:var(--muted); margin-top:5px; }
  /* month filter toolbar */
  .toolbar { display:flex; align-items:center; gap:8px; margin:0 0 18px; font-size:13px; color:var(--muted); }
  .toolbar label { margin-left:6px; }
  .toolbar label:first-child { margin-left:0; }
  .toolbar select, .toolbar input[type=date] { background:var(--panel2); color:var(--text);
                    border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer; }
  .toolbar input[type=date]::-webkit-calendar-picker-indicator { filter:invert(.8); cursor:pointer; }
  /* dashboard layout: left nav + content */
  .layout { display:flex; gap:24px; align-items:flex-start; }
  .sidebar { flex:0 0 210px; position:sticky; top:32px; background:var(--panel); border-radius:12px;
             padding:14px 12px; box-shadow:0 1px 3px rgba(0,0,0,.4); border:1px solid var(--border); }
  .sidebar .brand { font-size:15px; font-weight:600; padding:6px 12px 14px; color:var(--text); }
  .nav-item { display:block; padding:10px 12px; margin-bottom:4px; border-radius:8px;
              font-size:14px; color:var(--muted); text-decoration:none; cursor:pointer; }
  .nav-item:hover { background:var(--panel2); color:var(--text); }
  .nav-item.active { background:var(--blue); color:#10141a; font-weight:600; }
  .content { flex:1; min-width:0; }
  .content .head { margin-bottom:4px; }
  .content h1 { font-size:20px; margin:0; }
  .section-h { font-size:16px; margin:30px 0 12px; padding-top:6px; border-top:1px solid var(--border); }
  .card.june:hover { border-color:var(--green); }
  .card.june .stat .n, .card.june .go { color:var(--green-d); }
  /* detail */
  .head { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .left { display:flex; align-items:center; gap:14px; }
  .crumbs { font-size:15px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .crumb { color:var(--blue-d); text-decoration:none; cursor:pointer; }
  .crumb:hover { text-decoration:underline; }
  .crumb-sep { color:#5a616b; }
  .crumb-cur { font-weight:600; }
  button.btn { background:var(--blue); color:#10141a; border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button.btn:hover { background:var(--blue-d); }
  button.btn:disabled { background:#434a56; color:#8a929c; cursor:default; }
  .back { background:var(--panel2); color:var(--text); }
  .back:hover { background:#414854; }
  .panel { background:var(--panel); border-radius:12px; padding:26px 30px 36px; box-shadow:0 1px 3px rgba(0,0,0,.4); border:1px solid var(--border); }
  #updated { font-size:12px; color:var(--muted); }
  .chart-box { position:relative; height:480px; margin-top:10px; }
  .muted { color:var(--muted); }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  /* drill-down task list */
  .drill-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .drill-head h2 { font-size:17px; margin:0; }
  .drill-total { font-size:13px; color:var(--muted); }
  table.tasks { width:100%; border-collapse:collapse; font-size:14px; }
  table.tasks th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
                   color:var(--muted); border-bottom:2px solid var(--border); padding:8px 10px; }
  table.tasks td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.tasks tr.parent td { font-weight:600; }
  table.tasks tr.sub td { font-weight:400; color:var(--muted); }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--panel2); color:var(--text); }
  .sub-name { padding-left:22px; position:relative; }
  .sub-name::before { content:'↳'; position:absolute; left:6px; color:#5a616b; }
  .done { text-decoration:line-through; color:var(--faint); }
  .hours { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }

  /* login + sign-out (static build) */
  .login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:34px 32px;
                max-width:430px; width:100%; box-shadow:0 10px 34px rgba(0,0,0,.5); }
  .login-card h1 { font-size:22px; margin:0 0 6px; }
  .login-card .sub { margin:0 0 18px; }
  .login-card input[type=password] { width:100%; box-sizing:border-box; background:var(--panel2); color:var(--text);
                border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:14px; }
  .login-card .remember { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:12px 0 16px; }
  .login-card .btn { width:100%; padding:11px; }
  .login-err { color:var(--red); font-size:13px; margin:0 0 12px; }
  .login-note { font-size:11px; color:var(--faint); margin-top:16px; line-height:1.55; }
  .signout { position:fixed; top:16px; right:18px; z-index:50; background:var(--panel2); color:var(--text);
             border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; }
  .signout:hover { background:#414854; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

// ===== Static build: Asana data layer (runs entirely in the browser) =====
const ASANA_API = 'https://app.asana.com/api/1.0';
const EST_FIELD = "Estimated time";
const EXCLUDE_SECTIONS = new Set(["completed"]);
const ASSIGNEE_HOURS_CAP = 128;
const TEAM_MEMBERS = ["Wallace Norman", "Miranda Osborn", "Linh Trinh", "Julia McKinney", "Grant Roach"];
const PROJECTS = [{"gid": "1214228966572515", "name": "Georgia Grown Market MSA", "cap": 70}, {"gid": "1214228966572497", "name": "Mid Eastern MSA", "cap": 40}, {"gid": "1214228966572546", "name": "Cohen's Retreat MSA", "cap": 40}, {"gid": "1214228966572508", "name": "Firebird MSA", "cap": 15}, {"gid": "1214228966572503", "name": "Myrick Marine"}, {"gid": "1214228966572429", "name": "CLICR - Internal"}, {"gid": "1214229029715234", "name": "Savannah Bee: Zendesk"}, {"gid": "1214228966572536", "name": "CMD: Concierge Clinics"}, {"gid": "1214228966572531", "name": "CMD: Pathologic"}, {"gid": "1214228966572526", "name": "CMD: Products"}, {"gid": "1214228966572521", "name": "Georgia Skin & Cancer Clinic"}, {"gid": "1214228966572541", "name": "DocSmith.md"}, {"gid": "1214228966572551", "name": "Savannah Camellia Fest 2026"}, {"gid": "1214755322546416", "name": "Project Twilight"}, {"gid": "1214228966572578", "name": "Claude: Discovery and Engineering"}, {"gid": "1214228966572573", "name": "Autotask Reporting"}, {"gid": "1214228966572568", "name": "Brain Dump"}, {"gid": "1214228966572563", "name": "Internal IIT Backlog"}];
const DEF_START = "2026-06-01", DEF_END = "2026-06-30";
const PROJECT_NAMES = Object.fromEntries(PROJECTS.map(p => [p.gid, p.name]));
const PROJECT_CAPS  = Object.fromEntries(PROJECTS.map(p => [p.gid, p.cap == null ? null : p.cap]));

let TOKEN = null;
const _realFetch = window.fetch.bind(window);

function round2(x){ return Math.round((x + Number.EPSILON) * 100) / 100; }
function sum(arr){ return arr.reduce((a, b) => a + b, 0); }
function nowStr(){ const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

// Bound real network concurrency (Asana rate limits + browser per-host caps).
let _active = 0; const _waiters = [];
function _gate(fn){
  return new Promise((resolve, reject) => {
    const run = () => { _active++; fn().then(resolve, reject).finally(() => { _active--; const n = _waiters.shift(); if (n) n(); }); };
    if (_active < 8) run(); else _waiters.push(run);
  });
}

// GET an Asana collection (follows pagination, retries on 429). Returns the concatenated data array.
async function asanaGet(pathOrUrl){
  let out = [], next = pathOrUrl;
  while (next){
    const full = next.startsWith('http') ? next : ASANA_API + next;
    const page = await _gate(async () => {
      for (;;){
        const r = await _realFetch(full, { headers: { Authorization: 'Bearer ' + TOKEN } });
        if (r.status === 429){ const ra = Number(r.headers.get('Retry-After') || 1); await new Promise(s => setTimeout(s, ra * 1000)); continue; }
        if (!r.ok) throw new Error('Asana ' + r.status);
        return r.json();
      }
    });
    out = out.concat(page.data || []);
    next = page.next_page && page.next_page.uri ? page.next_page.uri : null;
  }
  return out;
}
const mapAll = (arr, fn) => Promise.all(arr.map(fn));

// ---- Estimated-hours layer (mirrors project_detail / get_summaries / get_assignee_load) ----
function taskMinutes(t){ for (const cf of (t.custom_fields || [])){ if (cf.name === EST_FIELD && cf.number_value != null) return cf.number_value; } return 0; }
function actualMinutes(t){ return t.actual_time_minutes || 0; }
function sectionName(t, gid){ let fb = ''; for (const m of (t.memberships || [])){ const sec = (m.section || {}).name; if (!sec) continue; if ((m.project || {}).gid === gid) return sec; fb = fb || sec; } return fb; }
function isExcluded(t, gid){ return EXCLUDE_SECTIONS.has(sectionName(t, gid).trim().toLowerCase()); }

function fetchTasks(gid){
  const f = 'name,assignee.name,completed,actual_time_minutes,custom_fields.name,custom_fields.number_value,memberships.section.name,memberships.project.gid';
  return asanaGet(`/projects/${gid}/tasks?opt_fields=${f}&limit=100`);
}
function fetchSubtasks(g){
  const f = 'name,assignee.name,completed,actual_time_minutes,custom_fields.name,custom_fields.number_value';
  return asanaGet(`/tasks/${g}/subtasks?opt_fields=${f}&limit=100`);
}

async function buildTask(t, gid){
  const subs = [];
  for (const s of await fetchSubtasks(t.gid)){
    if (s.completed) continue;
    subs.push({ name: s.name || '(untitled)', assignee: (s.assignee || {}).name || 'Unassigned',
      hours: round2(taskMinutes(s) / 60), actual: round2(actualMinutes(s) / 60) });
  }
  return { gid: t.gid, name: t.name || '(untitled)', assignee: (t.assignee || {}).name || 'Unassigned',
    hours: round2(taskMinutes(t) / 60), actual: round2(actualMinutes(t) / 60), section: sectionName(t, gid), subtasks: subs };
}

async function projectDetail(gid){
  const tasks = (await fetchTasks(gid)).filter(t => !t.completed && !isExcluded(t, gid));
  const detailed = await mapAll(tasks, t => buildTask(t, gid));
  const totals = {}, actuals = {}, counts = {};
  for (const d of detailed){
    totals[d.assignee] = (totals[d.assignee] || 0) + d.hours;
    actuals[d.assignee] = (actuals[d.assignee] || 0) + d.actual;
    counts[d.assignee] = (counts[d.assignee] || 0) + 1;
    for (const s of d.subtasks){
      totals[s.assignee] = (totals[s.assignee] || 0) + s.hours;
      actuals[s.assignee] = (actuals[s.assignee] || 0) + s.actual;
      counts[s.assignee] = (counts[s.assignee] || 0) + 1;
    }
  }
  const ordered = Object.keys(totals).sort((x, y) => totals[y] - totals[x]);
  return { gid, name: PROJECT_NAMES[gid] || gid, labels: ordered,
    hours: ordered.map(n => round2(totals[n])), actual_hours: ordered.map(n => round2(actuals[n])),
    counts: ordered.map(n => counts[n]), ntasks: detailed.length, tasks: detailed, updated: nowStr() };
}

const CACHE = { summaries: null, detail: {}, june_summaries: {}, june_detail: {} };
function summaryFromDetail(d){ return { gid: d.gid, name: d.name, ntasks: d.ntasks, hours: round2(sum(d.hours)), cap: PROJECT_CAPS[d.gid], updated: d.updated }; }

async function getDetail(gid, refresh){
  if (!refresh && CACHE.detail[gid]) return CACHE.detail[gid];
  const data = await projectDetail(gid);
  CACHE.detail[gid] = data;
  if (CACHE.summaries) CACHE.summaries = CACHE.summaries.map(s => s.gid === gid ? summaryFromDetail(data) : s);
  return data;
}
async function getSummaries(refresh){
  if (!refresh && CACHE.summaries) return CACHE.summaries;
  const details = await mapAll(PROJECTS, p => getDetail(p.gid, refresh));
  return (CACHE.summaries = details.map(summaryFromDetail));
}
async function getAssigneeLoad(refresh){
  const details = await mapAll(PROJECTS, p => getDetail(p.gid, refresh));
  const est = {}, act = {}, counts = {}, breakdown = {};
  for (const d of details){
    d.labels.forEach((name, i) => {
      const e = d.hours[i], aa = d.actual_hours[i], cnt = d.counts[i];
      est[name] = (est[name] || 0) + e; act[name] = (act[name] || 0) + aa; counts[name] = (counts[name] || 0) + cnt;
      if (e || aa) (breakdown[name] = breakdown[name] || []).push({ project: d.name, estimated: round2(e), actual: round2(aa), remaining: round2(e - aa) });
    });
  }
  const ordered = TEAM_MEMBERS.filter(n => n in est).sort((x, y) => (est[y] - act[y]) - (est[x] - act[x]));
  if ('Unassigned' in est) ordered.push('Unassigned');
  return { cap: ASSIGNEE_HOURS_CAP, labels: ordered,
    hours: ordered.map(n => round2(est[n] - act[n])), estimated: ordered.map(n => round2(est[n])),
    actual: ordered.map(n => round2(act[n])), counts: ordered.map(n => counts[n]),
    breakdown: Object.fromEntries(ordered.map(n => [n, breakdown[n] || []])), updated: nowStr() };
}

// ---- Logged-hours layer for a date range (mirrors june_detail / get_june_summaries) ----
function fetchTimeEntries(g){ return asanaGet(`/tasks/${g}/time_tracking_entries?opt_fields=duration_minutes,entered_on,created_by.name&limit=100`); }
function fetchSubtasksTime(g){ return asanaGet(`/tasks/${g}/subtasks?opt_fields=name,actual_time_minutes&limit=100`); }

async function entriesForItem(name, gid, start, end){
  const res = [];
  for (const e of await fetchTimeEntries(gid)){
    const entered = e.entered_on || '';
    if (entered && start <= entered && entered <= end)
      res.push({ entry_gid: e.gid, task: name, by: (e.created_by || {}).name || 'Unknown', date: entered, minutes: e.duration_minutes || 0 });
  }
  return res;
}
async function juneDetail(gid, start, end){
  const tasks = await asanaGet(`/projects/${gid}/tasks?opt_fields=name,actual_time_minutes,num_subtasks&limit=100`);
  const cand = {};
  for (const t of tasks) if ((t.actual_time_minutes || 0) > 0) cand[t.gid] = t.name || '(untitled)';
  const parents = tasks.filter(t => (t.num_subtasks || 0) > 0).map(t => t.gid);
  for (const subs of await mapAll(parents, fetchSubtasksTime))
    for (const s of subs) if ((s.actual_time_minutes || 0) > 0) cand[s.gid] = s.name || '(untitled)';
  const candidates = Object.entries(cand);   // [gid, name]
  const seen = new Set(), entries = [];
  for (const lst of await mapAll(candidates, ([g, name]) => entriesForItem(name, g, start, end)))
    for (const e of lst){ if (e.entry_gid && seen.has(e.entry_gid)) continue; if (e.entry_gid) seen.add(e.entry_gid); entries.push(e); }
  const totals = {}, counts = {};
  for (const e of entries){ totals[e.by] = (totals[e.by] || 0) + e.minutes; counts[e.by] = (counts[e.by] || 0) + 1; }
  const ordered = Object.keys(totals).sort((x, y) => totals[y] - totals[x]);
  entries.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  return { gid, name: PROJECT_NAMES[gid] || gid, start, end, labels: ordered,
    hours: ordered.map(n => round2(totals[n] / 60)), counts: ordered.map(n => counts[n]),
    total_hours: round2(sum(Object.values(totals)) / 60), nentries: entries.length,
    entries: entries.map(e => ({ task: e.task, by: e.by, date: e.date, hours: round2(e.minutes / 60) })), updated: nowStr() };
}
function juneSummaryFromDetail(d){ return { gid: d.gid, name: d.name, start: d.start, end: d.end, hours: d.total_hours, nentries: d.nentries, cap: PROJECT_CAPS[d.gid], updated: d.updated }; }

async function getJuneDetail(gid, refresh, start, end){
  const key = start + ':' + end;
  if (!refresh && CACHE.june_detail[key] && CACHE.june_detail[key][gid]) return CACHE.june_detail[key][gid];
  const data = await juneDetail(gid, start, end);
  (CACHE.june_detail[key] = CACHE.june_detail[key] || {})[gid] = data;
  if (CACHE.june_summaries[key]) CACHE.june_summaries[key] = CACHE.june_summaries[key].map(s => s.gid === gid ? juneSummaryFromDetail(data) : s);
  return data;
}
async function getJuneSummaries(refresh, start, end){
  const key = start + ':' + end;
  if (!refresh && CACHE.june_summaries[key]) return CACHE.june_summaries[key];
  const details = await mapAll(PROJECTS, p => getJuneDetail(p.gid, refresh, start, end));
  return (CACHE.june_summaries[key] = details.map(juneSummaryFromDetail));
}

// ---- Route /api/* (same shapes the existing UI expects) ----
async function handleApi(p){
  const u = new URL(p, location.origin), path = u.pathname, q = u.searchParams;
  const refresh = q.get('refresh') === '1';
  let start = q.get('start') || DEF_START, end = q.get('end') || DEF_END;
  if (start > end){ const t = start; start = end; end = t; }
  if (path === '/api/projects') return getSummaries(refresh);
  if (path === '/api/june') return getJuneSummaries(refresh, start, end);
  if (path === '/api/assignees') return getAssigneeLoad(refresh);
  if (path.startsWith('/api/june/')) return getJuneDetail(path.split('/').pop(), refresh, start, end);
  if (path.startsWith('/api/project/')) return getDetail(path.split('/').pop(), refresh);
  throw new Error('Unknown API ' + path);
}
// Intercept the page's own /api/* calls; everything else (Asana, CDN) passes through.
window.fetch = async (input, init) => {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  const p = url.replace(location.origin, '');
  if (p.startsWith('/api/')){
    try { return new Response(JSON.stringify(await handleApi(p)), { status: 200, headers: { 'Content-Type': 'application/json' } }); }
    catch (err) { return new Response(JSON.stringify({ error: String(err && err.message || err) }), { status: 502, headers: { 'Content-Type': 'application/json' } }); }
  }
  return _realFetch(input, init);
};

// ---- PAT auth / login screen ----
const STORE_KEY = 'asana_pat';
function loadToken(){ return sessionStorage.getItem(STORE_KEY) || localStorage.getItem(STORE_KEY) || null; }
function clearToken(){ sessionStorage.removeItem(STORE_KEY); localStorage.removeItem(STORE_KEY); }
async function validateToken(tok){
  const r = await _realFetch(ASANA_API + '/users/me?opt_fields=name,email', { headers: { Authorization: 'Bearer ' + tok } });
  if (!r.ok) throw new Error(r.status === 401 ? 'Invalid token' : 'Asana ' + r.status);
  return (await r.json()).data;
}
function showSignout(who){
  let b = document.getElementById('signout-fab');
  if (!b){ b = document.createElement('button'); b.id = 'signout-fab'; b.className = 'signout'; document.body.appendChild(b); }
  b.textContent = 'Sign out'; b.title = who ? ('Signed in as ' + who) : ''; b.onclick = doLogout; b.style.display = 'block';
}
function hideSignout(){ const b = document.getElementById('signout-fab'); if (b) b.style.display = 'none'; }
function doLogout(){ clearToken(); TOKEN = null; window.__authed = false; hideSignout();
  if (typeof chart !== 'undefined' && chart){ try { chart.destroy(); } catch (e) {} chart = null; } location.hash = ''; renderLogin(); }

function renderLogin(err){
  window.__authed = false; hideSignout();
  document.getElementById('app').innerHTML = `
    <div class="login"><div class="login-card">
      <h1>Asana Dashboard</h1>
      <p class="sub">Connect with a Personal Access Token. Create one in Asana → My Settings → Apps → Manage developer apps → Personal access tokens.</p>
      <input type="password" id="pat" placeholder="Paste your Asana PAT" autocomplete="off" spellcheck="false">
      <label class="remember"><input type="checkbox" id="remember"> Remember on this device</label>
      ${err ? `<p class="login-err">${esc(err)}</p>` : ''}
      <button class="btn" id="connect">Connect</button>
      <p class="login-note">Your token is stored only in this browser — sessionStorage, or localStorage if you check “remember” — and sent directly to Asana over HTTPS. Don’t use this on a shared computer, and never commit a token to the repo.</p>
    </div></div>`;
  const inp = document.getElementById('pat'), go = document.getElementById('connect');
  const submit = async () => {
    const tok = inp.value.trim(); if (!tok) return;
    go.disabled = true; go.textContent = 'Connecting…'; TOKEN = tok;
    try {
      const me = await validateToken(tok);
      (document.getElementById('remember').checked ? localStorage : sessionStorage).setItem(STORE_KEY, tok);
      window.__authed = true; showSignout(me.name || me.email || 'Signed in'); location.hash = ''; window.__startApp();
    } catch (e){ TOKEN = null; renderLogin(e && e.message || String(e)); }
  };
  go.onclick = submit;
  inp.onkeydown = ev => { if (ev.key === 'Enter') submit(); };
  inp.focus();
}

async function bootAuth(){
  const tok = loadToken();
  if (!tok){ renderLogin(); return; }
  TOKEN = tok;
  try { const me = await validateToken(tok); window.__authed = true; showSignout(me.name || me.email || 'Signed in'); window.__startApp(); }
  catch (e){ clearToken(); TOKEN = null; renderLogin('Saved token is no longer valid — please reconnect.'); }
}

</script>
<script>
const app = document.getElementById('app');
let chart = null;

// Dark-mode chart defaults: light tick/legend text and faint gridlines.
Chart.defaults.color = '#9aa0a8';
Chart.defaults.borderColor = 'rgba(255,255,255,.08)';

// Draws a dashed horizontal target line (e.g. the 128 h per-assignee cap) on a bar chart.
// Enable per-chart via options.plugins.capLine = { value: <hours> }.
const capLinePlugin = {
  id: 'capLine',
  afterDatasetsDraw(c) {
    const cfg = c.options.plugins.capLine;
    if (!cfg || cfg.value == null) return;
    const y = c.scales.y.getPixelForValue(cfg.value);
    const { left, right } = c.chartArea, ctx = c.ctx;
    ctx.save();
    ctx.beginPath(); ctx.setLineDash([6, 4]); ctx.lineWidth = 2; ctx.strokeStyle = '#8fc0ee';
    ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = '#8fc0ee'; ctx.font = '600 12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(cfg.value + ' h target', right - 6, y - 6);
    ctx.restore();
  }
};
Chart.register(capLinePlugin);

// Draws a per-bar monthly-budget marker: a short amber line across each bar that has a cap.
// Enable via options.plugins.capMarks = { caps: [<cap or null per bar>] }.
const capMarksPlugin = {
  id: 'capMarks',
  afterDatasetsDraw(c) {
    const cfg = c.options.plugins.capMarks;
    if (!cfg || !cfg.caps) return;
    const meta = c.getDatasetMeta(0), y = c.scales.y, ctx = c.ctx;
    ctx.save();
    cfg.caps.forEach((cap, i) => {
      const bar = meta.data[i];
      if (cap == null || !bar) return;
      const half = (bar.width || 18) / 2 + 2, py = y.getPixelForValue(cap);
      ctx.beginPath(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#f0c674';
      ctx.moveTo(bar.x - half, py); ctx.lineTo(bar.x + half, py); ctx.stroke();
    });
    ctx.restore();
  }
};
Chart.register(capMarksPlugin);

function fmtErr(e){ return '<p class="muted">Error: '+e+'</p>'; }
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function h2(x){ return Number(x || 0).toFixed(2); }   // always two decimals: 40.00, 40.50, 40.75
function capBar(hours, cap){
  if (cap == null) return '';   // only projects with a monthly capacity get a bar
  const pct = cap > 0 ? (hours / cap) * 100 : 0;
  const over = pct > 100;
  return `<div class="cap-bar${over ? ' over' : ''}">
      <div class="track"><div class="fill" style="width:${Math.min(pct,100)}%"></div></div>
      <div class="lab">${h2(hours)} / ${cap} h used · ${pct.toFixed(0)}%${over ? ' — over capacity' : ''}</div>
    </div>`;
}
function setCrumbs(items) {
  // items: [{label, fn?}] — entries with fn render as links; the last/plain one is the current page.
  const el = document.getElementById('crumbs');
  if (!el) return;
  el.innerHTML = items.map((it, i) => {
    const last = i === items.length - 1;
    return (last || !it.fn)
      ? `<span class="crumb-cur">${esc(it.label)}</span>`
      : `<a href="#" class="crumb" data-ci="${i}">${esc(it.label)}</a>`;
  }).join('<span class="crumb-sep">›</span>');
  el.querySelectorAll('a.crumb').forEach(a => {
    a.onclick = (e) => { e.preventDefault(); items[+a.dataset.ci].fn(); };
  });
}

// Which dashboard tab is active; remembered across renders/drill-ins.
let dashTab = 'team';   // Team Capacity is the default tab
// Selected date range (YYYY-MM-DD) for the "Actual Hours" view; shared by the tab and drill-in.
let dateStart = '2026-06-01', dateEnd = '2026-06-30';
function fmtDate(d){ const [y,m,day]=d.split('-').map(Number); return new Date(y, m-1, day).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function rangeLabel(s, e){ return fmtDate(s) + ' – ' + fmtDate(e); }
function rangePicker(){
  return `<div class="toolbar">
      <label for="d-start">From</label><input type="date" id="d-start" value="${dateStart}">
      <label for="d-end">To</label><input type="date" id="d-end" value="${dateEnd}">
      <button class="btn" id="range-go">Search</button>
    </div>`;
}
const TABS = {
  team: { label:'Team Capacity', title:'Team Capacity',
    sub:'Remaining hours (estimated − actual) per assignee across all projects vs. the 128 h target. Click a bar for the per-project breakdown.' },
  actualproj: { label:'Actual Hours', title:'Actual Hours',
    sub:'Actual hours logged per project in the selected date range. Click a bar to drill into that project.' },
  estimated: { label:'Estimated Hours', title:'Estimated Hours',
    sub:'Estimated hours per project (excludes Completed). Click a widget to drill in.' },
  june: { label:'Hours Logged', title:'Hours Logged',
    sub:'Actual time-tracking entries logged in the selected date range. Click a widget to drill in.' },
  capacity: { label:'Monthly Capacity', title:'Monthly Capacity',
    sub:'Projects with a monthly hour budget — selected range’s usage vs. capacity. Click to drill in.' },
};

function estCard(w) {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<h3>${esc(w.name)}</h3>
    <div class="stats">
      <div class="stat"><div class="n">${h2(w.hours)}</div><div class="l">Est. Hours</div></div>
      <div class="stat"><div class="n">${w.ntasks}</div><div class="l">Tasks</div></div>
      ${w.cap != null ? `<div class="stat"><div class="n">${w.cap}</div><div class="l">Capacity h/mo</div></div>` : ''}
    </div>
    <div class="go">Open chart →</div>
    <div class="card-updated">Updated ${esc(w.updated)}</div>`;
  c.onclick = () => { location.hash = '#/p/' + w.gid; };
  return c;
}

function juneCard(w) {
  const c = document.createElement('div');
  c.className = 'card june';
  c.innerHTML = `<h3>${esc(w.name)}</h3>
    <div class="stats">
      <div class="stat"><div class="n">${h2(w.hours)}</div><div class="l">Hours Logged</div></div>
      <div class="stat"><div class="n">${w.nentries}</div><div class="l">Entries</div></div>
      ${w.cap != null ? `<div class="stat"><div class="n">${w.cap}</div><div class="l">Capacity h/mo</div></div>` : ''}
    </div>
    ${capBar(w.hours, w.cap)}
    <div class="go">Open chart →</div>
    <div class="card-updated">Updated ${esc(w.updated)}</div>`;
  c.onclick = () => { location.hash = '#/june/' + w.gid; };
  return c;
}

function capCard(w) {
  const used = Number(w.hours || 0), cap = Number(w.cap || 0);
  const remaining = cap - used;
  const c = document.createElement('div');
  c.className = 'card june';
  c.innerHTML = `<h3>${esc(w.name)}</h3>
    <div class="stats">
      <div class="stat"><div class="n">${w.cap}</div><div class="l">Capacity h/mo</div></div>
      <div class="stat"><div class="n">${h2(used)}</div><div class="l">Used</div></div>
      <div class="stat"><div class="n"${remaining < 0 ? ' style="color:#e26b66"' : ''}>${h2(remaining)}</div><div class="l">${remaining < 0 ? 'Over' : 'Remaining'}</div></div>
    </div>
    ${capBar(used, cap)}
    <div class="go">Open chart →</div>
    <div class="card-updated">Updated ${esc(w.updated)}</div>`;
  c.onclick = () => { location.hash = '#/june/' + w.gid; };
  return c;
}

async function renderDashboard() {
  if (chart) { chart.destroy(); chart = null; }
  app.innerHTML = `
    <div class="layout">
      <nav class="sidebar">
        <div class="brand">Asana Dashboard</div>
        ${Object.keys(TABS).map(k => `<a href="#" class="nav-item" data-tab="${k}">${TABS[k].label}</a>`).join('')}
      </nav>
      <main class="content">
        <div class="head">
          <h1 id="tab-title"></h1>
          <button class="btn" id="dash-refresh">Refresh</button>
        </div>
        <p class="sub" id="tab-sub"></p>
        <div id="tabview"><p class="muted">Loading widgets…</p></div>
      </main>
    </div>`;
  const view = document.getElementById('tabview');
  const btn = document.getElementById('dash-refresh');
  let estData = null, juneData = null, teamData = null;   // cached so switching tabs is instant

  // Wire the date-range Search button (if the current tab rendered one). Editing the date
  // fields does nothing until Search is clicked (or Enter is pressed in a field).
  function wireRangeSel() {
    const s = document.getElementById('d-start'), e = document.getElementById('d-end'),
          go = document.getElementById('range-go');
    if (!go) return;
    const apply = () => {
      if (s.value) dateStart = s.value;
      if (e.value) dateEnd = e.value;
      juneData = null; renderTab(); loadJune(false);
    };
    go.onclick = apply;
    [s, e].forEach(inp => inp.onkeydown = ev => { if (ev.key === 'Enter') apply(); });
  }

  function cardGrid(items, cardFn, empty, toolbar) {
    view.innerHTML = toolbar || '';
    if (!items.length) { view.insertAdjacentHTML('beforeend', `<p class="muted">${empty}</p>`); }
    else {
      const grid = document.createElement('div');
      grid.className = 'grid';
      items.forEach(w => grid.appendChild(cardFn(w)));
      view.appendChild(grid);
    }
    wireRangeSel();
  }

  function renderActualProj() {
    // Bar chart of actual hours logged per project for the selected date range.
    const picker = rangePicker();
    if (!juneData) { view.innerHTML = picker + '<p class="muted">Loading widgets…</p>'; wireRangeSel(); return; }
    view.innerHTML = picker + '<div class="chart-box"><canvas id="chart"></canvas></div>' +
      `<p class="hint">Actual hours logged per project, ${rangeLabel(dateStart, dateEnd)}. The amber line marks a project’s monthly budget; the bar turns red when logged hours exceed it. Click a bar to drill into that project.</p>`;
    wireRangeSel();
    if (chart) { chart.destroy(); chart = null; }
    const rows = juneData.slice().sort((a, b) => b.hours - a.hours);
    const labels = rows.map(w => w.name), data = rows.map(w => w.hours);
    const gids = rows.map(w => w.gid), ents = rows.map(w => w.nentries);
    const caps = rows.map(w => (w.cap == null ? null : w.cap));
    const colors = rows.map(w => (w.cap != null && w.hours > w.cap) ? '#e26b66' : '#4cc085');
    const borders = rows.map(w => (w.cap != null && w.hours > w.cap) ? '#e98e8a' : '#6cd49d');
    // Keep every budget marker visible even if it sits above the tallest bar.
    const top = Math.max(...data, ...caps.filter(c => c != null), 1);
    chart = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Actual hours', data,
        backgroundColor: colors, borderColor: borders, borderWidth: 1, _ents: ents, _caps: caps }] },
      options: { responsive: true, maintainAspectRatio: false,
        onClick: (evt, els) => { if (els.length) location.hash = '#/june/' + gids[els[0].index]; },
        onHover: (evt, els) => { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
        scales: { x: { title: { display: true, text: 'Project' } },
                  y: { beginAtZero: true, suggestedMax: top * 1.05,
                       title: { display: true, text: 'Actual hours logged' }, ticks: { callback: v => h2(v) } } },
        plugins: { legend: { display: false }, capMarks: { caps },
          tooltip: { callbacks: {
            label: ctx => `Logged: ${h2(ctx.parsed.y)} h`,
            afterLabel: ctx => {
              const cap = ctx.dataset._caps[ctx.dataIndex];
              let s = `Entries: ${ctx.dataset._ents[ctx.dataIndex]}`;
              if (cap != null) s += ` · Budget ${cap} h (${(ctx.parsed.y / cap * 100).toFixed(0)}%)`;
              return s + ' · click to drill in';
            } } } } }
    });
  }

  function renderTeam() {
    // Bar chart of estimated hours per assignee, with a dashed line at the 128 h target.
    const d = teamData;
    view.innerHTML = '<div class="chart-box"><canvas id="chart"></canvas></div>' +
      '<p class="hint">Bars show remaining work (estimated − actual). Over the target line is red (over-allocated). Click a bar for the per-project breakdown.</p>';
    if (chart) { chart.destroy(); chart = null; }
    const colors = d.hours.map(h => h > d.cap ? '#e26b66' : '#4cc085');
    chart = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: { labels: d.labels, datasets: [{ label: 'Remaining hours', data: d.hours,
        backgroundColor: colors, borderColor: colors, borderWidth: 1,
        _counts: d.counts, _est: d.estimated, _act: d.actual }] },
      options: { responsive: true, maintainAspectRatio: false,
        onClick: (evt, els) => { if (els.length) showBreakdown(d.labels[els[0].index]); },
        onHover: (evt, els) => { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
        scales: { x: { title: { display: true, text: 'Assignee' },
                       ticks: { callback: (v, i) => [d.labels[i], h2(d.hours[i]) + ' h'] } },
                  y: { beginAtZero: true, suggestedMax: Math.max(d.cap * 1.1, ...d.hours, 1),
                       title: { display: true, text: 'Remaining hours' }, ticks: { callback: v => h2(v) } } },
        plugins: { legend: { display: false }, capLine: { value: d.cap },
          tooltip: { callbacks: {
            label: ctx => `Remaining: ${h2(ctx.parsed.y)} h of ${d.cap} (${(ctx.parsed.y / d.cap * 100).toFixed(0)}%)`,
            afterLabel: ctx => `Est ${h2(ctx.dataset._est[ctx.dataIndex])} − actual ${h2(ctx.dataset._act[ctx.dataIndex])} · ${ctx.dataset._counts[ctx.dataIndex]} items · click for breakdown` } } } }
    });
  }

  function showBreakdown(name) {
    if (chart) { chart.destroy(); chart = null; }
    const rows_ = (teamData.breakdown[name] || []).slice().sort((a, b) => b.remaining - a.remaining);
    const totEst = rows_.reduce((a, r) => a + r.estimated, 0);
    const totAct = rows_.reduce((a, r) => a + r.actual, 0);
    const totRem = totEst - totAct;
    const pct = (totRem / teamData.cap * 100).toFixed(0);
    let rows = rows_.map(r => `<tr><td>${esc(r.project)}</td>` +
      `<td class="hours">${h2(r.estimated)} h</td>` +
      `<td class="hours">${h2(r.actual)} h</td>` +
      `<td class="hours">${h2(r.remaining)} h</td></tr>`).join('');
    if (!rows_.length) rows = '<tr><td colspan="4" class="muted">No estimated or actual hours.</td></tr>';
    view.innerHTML =
      `<div class="drill-head">
         <h2>${esc(name)}</h2>
         <button class="btn back" id="tochart">← Back to chart</button>
       </div>
       <p class="drill-total">${h2(totRem)} h remaining of ${teamData.cap} (${pct}%) · ${h2(totEst)} est − ${h2(totAct)} actual · ${rows_.length} project(s)</p>
       <table class="tasks">
         <thead><tr><th>Project</th><th class="hours">Est.</th><th class="hours">Actual</th><th class="hours">Remaining</th></tr></thead>
         <tbody>${rows}</tbody>
       </table>`;
    document.getElementById('tochart').onclick = renderTeam;
  }

  function renderTab() {
    if (chart) { chart.destroy(); chart = null; }   // leaving any chart tab
    document.querySelectorAll('.nav-item').forEach(a =>
      a.classList.toggle('active', a.dataset.tab === dashTab));
    // Range-based tabs put the selected date range in the title.
    let title = TABS[dashTab].title;
    if (dashTab === 'june') title = `Hours Logged · ${rangeLabel(dateStart, dateEnd)}`;
    else if (dashTab === 'actualproj') title = `Actual Hours · ${rangeLabel(dateStart, dateEnd)}`;
    document.getElementById('tab-title').textContent = title;
    document.getElementById('tab-sub').textContent = TABS[dashTab].sub;
    const loading = '<p class="muted">Loading widgets…</p>';

    if (dashTab === 'team') {
      teamData ? renderTeam() : (view.innerHTML = loading);
    } else if (dashTab === 'actualproj') {
      renderActualProj();
    } else if (dashTab === 'estimated') {
      estData ? cardGrid(estData, estCard, 'No projects.') : (view.innerHTML = loading);
    } else if (dashTab === 'june') {
      cardGrid(juneData || [], juneCard,
        juneData ? `No hours logged in ${rangeLabel(dateStart, dateEnd)}.` : 'Loading widgets…', rangePicker());
    } else if (dashTab === 'capacity') {
      cardGrid((juneData || []).filter(w => w.cap != null), capCard,
        juneData ? 'No projects have a monthly capacity set.' : 'Loading widgets…', rangePicker());
    }
  }

  document.querySelectorAll('.nav-item').forEach(a => {
    a.onclick = (e) => { e.preventDefault(); dashTab = a.dataset.tab; renderTab(); };
  });

  // Loads the selected range's "Actual Hours" widgets (used on its own when the range changes).
  async function loadJune(refresh) {
    const s = dateStart, e = dateEnd;   // capture so a fast re-pick doesn't paint stale data
    try {
      const url = `/api/june?start=${s}&end=${e}` + (refresh ? '&refresh=1' : '');
      const j = await fetch(url).then(r => r.json());
      if (s !== dateStart || e !== dateEnd) return;   // a newer range was picked mid-flight
      juneData = j;
    } catch (err) { view.innerHTML = fmtErr(err); return; }
    if (['june', 'capacity', 'actualproj'].includes(dashTab)) renderTab();
  }

  async function loadAll(refresh) {
    btn.disabled = true; btn.textContent = refresh ? 'Refreshing…' : 'Refresh';
    const q = refresh ? '?refresh=1' : '';
    try {
      const [e] = await Promise.all([
        fetch('/api/projects' + q).then(r => r.json()),
        loadJune(refresh),
      ]);
      estData = e;
      // Team load derives from the per-project detail that /api/projects just (re)built,
      // so it reads the warm cache — no refresh flag, no duplicate Asana pulls.
      teamData = await fetch('/api/assignees').then(r => r.json());
    } catch (err) { view.innerHTML = fmtErr(err); }
    renderTab();
    btn.disabled = false; btn.textContent = 'Refresh';
  }
  btn.onclick = () => loadAll(true);
  renderTab();        // paint sidebar + active tab immediately (shows "Loading…")
  loadAll(false);     // navigation = cached
}

async function renderDetail(gid) {
  app.innerHTML = `
    <div class="head">
      <div id="crumbs" class="crumbs">Loading…</div>
      <button class="btn" id="refresh">Refresh</button>
    </div>
    <p class="sub" id="sub"></p>
    <div class="panel">
      <div id="view"></div>
      <p id="updated">Loading…</p>
    </div>`;
  const toDash = () => { location.hash = ''; };
  const btn = document.getElementById('refresh');
  let detailData = null;

  function showChart() {
    const d = detailData;
    setCrumbs([{label:'Dashboard', fn:toDash}, {label:d.name}]);
    document.getElementById('view').innerHTML =
      '<div class="chart-box"><canvas id="chart"></canvas></div>' +
      '<p class="hint">Tip: click a bar to see the tasks (and subtasks) that make up that assignee.</p>';
    if (chart) { chart.destroy(); chart = null; }
    chart = new Chart(document.getElementById('chart'), {
      type:'bar',
      data:{ labels:d.labels, datasets:[{ label:'Estimated hours', data:d.hours,
        backgroundColor:'#6aa9e0', borderColor:'#9cc7f0', borderWidth:1, _counts:d.counts }] },
      options:{ responsive:true, maintainAspectRatio:false,
        onClick:(evt, els) => { if (els.length) showTasks(d.labels[els[0].index]); },
        onHover:(evt, els) => { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{
          label: ctx => `Estimated: ${h2(ctx.parsed.y)} h`,
          afterLabel: ctx => `Items: ${ctx.dataset._counts[ctx.dataIndex]} · click to view` } } },
        scales:{ x:{ title:{display:true,text:'Assignee'}, ticks:{ callback:(v,i) => [d.labels[i], h2(d.hours[i]) + ' h'] } },
                 y:{ beginAtZero:true, title:{display:true,text:'Estimated hours'}, ticks:{ callback:v => h2(v) } } } }
    });
  }

  function showTasks(assignee) {
    if (chart) { chart.destroy(); chart = null; }
    setCrumbs([{label:'Dashboard', fn:toDash}, {label:detailData.name, fn:showChart}, {label:assignee}]);
    const all = detailData.tasks;
    let rows = '', total = 0, items = 0;

    function subRow(s, context) {
      total += s.hours; items++;
      return `<tr class="sub"><td class="sub-name">${esc(s.name)}${context}</td>` +
        `<td class="muted">subtask</td>` +
        `<td class="hours">${s.hours ? h2(s.hours) + ' h' : '—'}</td></tr>`;
    }

    // 1. Tasks owned by this assignee, with only THEIR subtasks nested underneath.
    all.filter(t => t.assignee === assignee).forEach(t => {
      total += t.hours; items++;
      rows += `<tr class="parent"><td>${esc(t.name)}</td>` +
        `<td><span class="badge">${esc(t.section) || '—'}</span></td>` +
        `<td class="hours">${h2(t.hours)} h</td></tr>`;
      t.subtasks.filter(s => s.assignee === assignee).forEach(s => { rows += subRow(s, ''); });
    });

    // 2. This assignee's subtasks that live under someone else's task.
    all.filter(t => t.assignee !== assignee).forEach(t => {
      t.subtasks.filter(s => s.assignee === assignee).forEach(s => {
        rows += subRow(s, ` <span class="muted">(under "${esc(t.name)}" · ${esc(t.assignee)})</span>`);
      });
    });

    if (!items) rows = '<tr><td colspan="3" class="muted">No items.</td></tr>';
    document.getElementById('view').innerHTML =
      `<div class="drill-head">
         <h2>${esc(assignee)}</h2>
         <button class="btn back" id="tochart">← Back to chart</button>
       </div>
       <p class="drill-total">${items} item(s) · ${h2(total)} estimated hours (excludes Completed)</p>
       <table class="tasks">
         <thead><tr><th>Task / Subtask</th><th>Type / Status</th><th class="hours">Est. hours</th></tr></thead>
         <tbody>${rows}</tbody>
       </table>`;
    document.getElementById('tochart').onclick = showChart;
  }

  async function load(refresh) {
    btn.disabled = true; btn.textContent = refresh ? 'Refreshing…' : 'Refresh';
    try {
      detailData = await (await fetch('/api/project/' + gid + (refresh ? '?refresh=1' : ''))).json();
      document.getElementById('sub').textContent = `Estimated hours per assignee · ${detailData.ntasks} tasks (excludes Completed)`;
      document.getElementById('updated').textContent = 'Last updated: ' + detailData.updated + ' (cached — click Refresh to re-pull)';
      showChart();
    } catch (e) { document.getElementById('updated').innerHTML = fmtErr(e); }
    finally { btn.disabled = false; btn.textContent = 'Refresh'; }
  }
  btn.onclick = () => load(true);
  load(false);   // navigation = cached
}

async function renderJuneDetail(gid) {
  app.innerHTML = `
    <div class="head">
      <div id="crumbs" class="crumbs">Loading…</div>
      <button class="btn" id="refresh">Refresh</button>
    </div>
    <p class="sub" id="sub"></p>
    <div class="panel">
      <div id="view"></div>
      <p id="updated">Loading…</p>
    </div>`;
  const toDash = () => { location.hash = ''; };
  const btn = document.getElementById('refresh');
  let data = null;

  function showChart() {
    const ml = rangeLabel(data.start, data.end);
    setCrumbs([{label:'Dashboard', fn:toDash}, {label:data.name + ' · ' + ml}]);
    document.getElementById('view').innerHTML =
      '<div class="chart-box"><canvas id="chart"></canvas></div>' +
      `<p class="hint">Tip: click a bar to see the individual time entries that person logged in ${ml}.</p>`;
    if (chart) { chart.destroy(); chart = null; }
    chart = new Chart(document.getElementById('chart'), {
      type:'bar',
      data:{ labels:data.labels, datasets:[{ label:'Hours logged (' + ml + ')', data:data.hours,
        backgroundColor:'#4cc085', borderColor:'#6cd49d', borderWidth:1, _counts:data.counts }] },
      options:{ responsive:true, maintainAspectRatio:false,
        onClick:(evt, els) => { if (els.length) showEntries(data.labels[els[0].index]); },
        onHover:(evt, els) => { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{
          label: ctx => `Logged: ${h2(ctx.parsed.y)} h`,
          afterLabel: ctx => `Entries: ${ctx.dataset._counts[ctx.dataIndex]} · click to view` } } },
        scales:{ x:{ title:{display:true,text:'Logged by'}, ticks:{ callback:(v,i) => [data.labels[i], h2(data.hours[i]) + ' h'] } },
                 y:{ beginAtZero:true, title:{display:true,text:'Hours logged in ' + ml}, ticks:{ callback:v => h2(v) } } } }
    });
  }

  function showEntries(person) {
    if (chart) { chart.destroy(); chart = null; }
    const ml = rangeLabel(data.start, data.end);
    setCrumbs([{label:'Dashboard', fn:toDash}, {label:data.name + ' · ' + ml, fn:showChart}, {label:person}]);
    const rows_ = data.entries.filter(e => e.by === person);
    const total = rows_.reduce((a, e) => a + e.hours, 0);
    let rows = '';
    rows_.forEach(e => {
      rows += `<tr><td>${esc(e.date)}</td><td>${esc(e.task)}</td><td class="hours">${h2(e.hours)} h</td></tr>`;
    });
    if (!rows_.length) rows = '<tr><td colspan="3" class="muted">No entries.</td></tr>';
    document.getElementById('view').innerHTML =
      `<div class="drill-head">
         <h2>${esc(person)}</h2>
         <button class="btn back" id="tochart">← Back to chart</button>
       </div>
       <p class="drill-total">${rows_.length} entr${rows_.length === 1 ? 'y' : 'ies'} · ${total.toFixed(2)} hours logged in ${ml}</p>
       <table class="tasks">
         <thead><tr><th>Date</th><th>Task</th><th class="hours">Hours</th></tr></thead>
         <tbody>${rows}</tbody>
       </table>`;
    document.getElementById('tochart').onclick = showChart;
  }

  async function load(refresh) {
    btn.disabled = true; btn.textContent = refresh ? 'Refreshing…' : 'Refresh';
    try {
      data = await (await fetch('/api/june/' + gid + `?start=${dateStart}&end=${dateEnd}` + (refresh ? '&refresh=1' : ''))).json();
      document.getElementById('sub').textContent = `Hours logged ${rangeLabel(data.start, data.end)} per person · ${data.nentries} time entries · ${h2(data.total_hours)} h total`;
      document.getElementById('updated').textContent = 'Last updated: ' + data.updated + ' (cached — click Refresh to re-pull)';
      showChart();
    } catch (e) { document.getElementById('updated').innerHTML = fmtErr(e); }
    finally { btn.disabled = false; btn.textContent = 'Refresh'; }
  }
  btn.onclick = () => load(true);
  load(false);
}

function route() {
  if (chart) { chart.destroy(); chart = null; }
  let m = location.hash.match(/^#\/june\/(\d+)/);
  if (m) return renderJuneDetail(m[1]);
  m = location.hash.match(/^#\/p\/(\d+)/);
  if (m) return renderDetail(m[1]);
  renderDashboard();
}
window.addEventListener('hashchange', () => { if (window.__authed) route(); });
window.__startApp = route;
bootAuth();
</script>
</body>
</html>
